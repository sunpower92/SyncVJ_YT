<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>SyncVJ YT - Projection</title>
  <style>
    body { margin: 0; background: black; overflow: hidden; }
    #player { width: 100vw; height: 100vh; border: none; pointer-events: none; }
  </style>
</head>
<body>
  <div id="player"></div>
  <script src="https://www.youtube.com/iframe_api"></script>
  <script>
    let player;
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('player', {
        height: '100%',
        width: '100%',
        videoId: '',
        playerVars: { 
          autoplay: 1, 
          controls: 0,       // OBS用はコントロールなし
          mute: 1,           // 自動再生ブロック回避のためミュート
          disablekb: 1,
          rel: 0,
          iv_load_policy: 3,
          modestbranding: 1
        },
        events: { 
          // プレイヤー準備完了時に親ウィンドウが参照できるようにグローバルに露出
          onReady: () => { window.popYT = player; }
        }
      });
    }
  </script>
</body>
</html>
